[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persuarl"
version = "1.0.0"
description = "PersuaRL: RL-driven multi-expert selection for persuasive dialogue generation in insurance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["reinforcement-learning", "grpo", "persuasive-dialogue", "llm", "insurance"]

classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Kept in sync with requirements.txt. torch is intentionally absent -- the
# correct wheel depends on your CUDA version; install it first.
dependencies = [
    "transformers>=4.44.0,<5.0.0",
    "trl>=0.12.0",
    "peft>=0.11.0",
    "accelerate>=0.30.0",
    "datasets>=2.19.0",
    "bert-score>=0.3.13",
    "sentencepiece>=0.2.0",
    "rouge-score>=0.1.2",
    "nltk>=3.8.1",
    "scikit-learn>=1.3.0",
    "evaluate>=0.4.1",
    "pandas>=2.0.0",
    "numpy>=1.24.0,<2.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
quant = ["bitsandbytes>=0.43.0"]
logging = ["tensorboard>=2.15.0", "wandb>=0.17.0"]
dev = ["pytest>=8.0", "ruff>=0.5.0"]

[project.scripts]
# Same entry points as `python -m persuarl.cli.<name>`, for convenience.
persuarl-prepare-data = "persuarl.cli.prepare_data:main"
persuarl-train-expert = "persuarl.cli.train_expert:main"
persuarl-run-experts = "persuarl.cli.run_experts:main"
persuarl-train-reward-models = "persuarl.cli.train_reward_models:main"
persuarl-train-sft = "persuarl.cli.train_sft:main"
persuarl-train-selector = "persuarl.cli.train_selector:main"
persuarl-train-single-grpo = "persuarl.cli.train_single_grpo:main"
persuarl-run-pipeline = "persuarl.cli.run_pipeline:main"
persuarl-evaluate = "persuarl.cli.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # long lines are usually prompts or docstrings
    "B008",  # dataclass-style default factories in signatures
    # zip(strict=): batch lists here are constructed together and are equal by
    # construction; the reward path validates lengths explicitly where it matters.
    "B905",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
