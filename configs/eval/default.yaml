# Automatic metrics for Table 2.
#   python -m persuarl.cli.evaluate --config configs/eval/default.yaml
#   python -m persuarl.cli.evaluate --config configs/eval/default.yaml \
#       --set input_path=results/baseline.csv

defaults: [../base.yaml]

input_path: results/persuarl.csv
output_path: results/metrics/persuarl_metrics.csv

candidate_column: model_reply
reference_column: reference_reply

bertscore_model: bert-base-uncased
device: null            # null -> cuda when available

# Both are optional and each loads an extra model. Leave null to skip.
perplexity_model_id: null      # e.g. meta-llama/Llama-3.2-3B-Instruct
judge_model_id: null           # e.g. prometheus-eval/prometheus-7b-v2.0
