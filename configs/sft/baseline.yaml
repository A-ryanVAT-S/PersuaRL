# Single-model SFT baseline -- the "SFT" column of Table 2, and the warm start
# for the single-model GRPO baselines. No experts, no routing.
#
#   python -m persuarl.cli.train_sft --config configs/sft/baseline.yaml
#   python -m persuarl.cli.train_sft --config configs/sft/baseline.yaml \
#       --set model.id=Qwen/Qwen2.5-3B-Instruct

defaults: [../base.yaml, ../models/llama32-3b.yaml]

output_dir: "${MODELS_ROOT:-./outputs}/sft_baseline"

model:
  quantization:
    bits: 4        # QLoRA; the baselines do not need full precision

data:
  style: baseline
  max_length: 1024
  include_history: true

train:
  epochs: 1
  batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  eval_strategy: steps
  eval_steps: 1000
  save_strategy: steps
  save_steps: 1000
  save_total_limit: 2
  logging_steps: 50
  load_best_model_at_end: true
  report_to: [tensorboard]
