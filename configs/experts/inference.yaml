# Annotate a corpus with the trained expert modules.
#   python -m persuarl.cli.run_experts --config configs/experts/inference.yaml

defaults: [../base.yaml]

output_dir: "${DATA_ROOT:-./data}/insuredial/expert_outputs"
batch_size: 8

generation:
  # Short on purpose: an expert answer is a label plus a line or two. Letting it
  # run to 512 tokens just invites the model to start writing dialogue.
  max_new_tokens: 96
  temperature: 0.8
  top_p: 0.95
  top_k: 40

experts:
  id: meta-llama/Llama-3.2-3B-Instruct   # default backbone for all four
  engagement:
    adapter_path: "${MODELS_ROOT:-./outputs}/experts/engagement"
  intent:
    adapter_path: "${MODELS_ROOT:-./outputs}/experts/intent"
  keyterm:
    adapter_path: "${MODELS_ROOT:-./outputs}/experts/keyterm"
  sentiment:
    adapter_path: "${MODELS_ROOT:-./outputs}/experts/sentiment"
